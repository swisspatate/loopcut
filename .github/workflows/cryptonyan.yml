name: CryptoNyan mission bridge

on:
  pull_request:
    paths:
      - 'scripts/addons_core/cryptonyan_asset_studio/**'
      - 'loopcut/tests/test_cryptonyan*.py'
      - 'loopcut/tests/fake_cryptonyan_codex.py'
      - 'loopcut/harness/cryptonyan_fixture.py'
      - 'loopcut/harness/cryptonyan_unreal.py'
      - 'loopcut/harness/cryptonyan_material.py'
      - 'loopcut/harness/cryptonyan_world.py'
      - 'loopcut/harness/cryptonyan_preview_fixture.py'
      - 'loopcut/harness/cryptonyan_world_pbr_fixture.py'
      - 'loopcut/harness/cryptonyan_creative_fixture.py'
      - 'loopcut/harness/cryptonyan_animation_fixture.py'
      - 'loopcut/harness/cryptonyan_rig_fixture.py'
      - 'loopcut/harness/cryptonyan_garment_fixture.py'
      - 'loopcut/harness/cryptonyan_connection_fixture.py'
      - 'loopcut/harness/cryptonyan_reference_fixture.py'
      - 'loopcut/harness/cryptonyan_versions_fixture.py'
      - 'loopcut/harness/cryptonyan_layers_fixture.py'
      - 'loopcut/harness/cryptonyan_camera_fixture.py'
      - 'loopcut/harness/cryptonyan_context_fixture.py'
      - 'loopcut/harness/cryptonyan_modular_fixture.py'
      - 'loopcut/harness/cryptonyan_mask_browser_fixture.js'
      - 'integrations/unreal/CryptoNyanRuntime/**'
      - '.github/workflows/cryptonyan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_codex.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_agent_connect.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_reference_board.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_publisher.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_materials.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_comfyui.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_comfy_profiles.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_comfy_preflight.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_texture_collections.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_game_project.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_unreal_materials.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_creative.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_animation.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_unreal_animation.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_rig.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_rig_repair.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_director.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_scenes.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_level_materials.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_image_workshop.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_garments.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_comfy_references.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_runner.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_worlds.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_assembly.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_preview.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_world_materials.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_visual_versions.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_material_layers.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_camera_moves.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_scene_context.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_mask_paint.py -v
      - run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_modular_levels.py -v
      - name: Optional Blender checks (explicitly skip without executable)
        run: python -m unittest discover -s loopcut/tests -p test_cryptonyan_blender.py -v
